name: Background Job CI/CD

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"

jobs:
  repoguard-security-scan:
    name: RepoGuard Pre-Execution Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run RepoGuard Security Check
        uses: ALADETAN-IFE/repoguard-action@69e6ce176271ba94e9d80b8cbecce6f8eb2569d3 # v1
        with:
          minimum-severity: medium
          fail-on: high
  # ------------------------
  # CI - Test, Lint & Typecheck
  # ------------------------

  test_fe:
    needs: [repoguard-security-scan]
    name: FE Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with Prettier
        run: pnpm check-format

      - name: Lint with ESLint
        run: pnpm lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build application
        run: pnpm build

  test_be:
    needs: [repoguard-security-scan]
    name: BE Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with Prettier
        run: pnpm check-format

      - name: Lint with ESLint
        run: pnpm lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build application
        run: pnpm build
